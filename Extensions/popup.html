<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HokieTutor Canvas Sync</title>
  <style>
    body {
      width: 340px;
      font-family: system-ui, sans-serif;
      padding: 16px;
      margin: 0;
      color: #222;
      background: #f9fafb;
    }
    h2 {
      font-size: 16px;
      color: #861f41;
      margin-top: 0;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #861f41;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #6d1834;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #status {
      font-size: 13px;
      color: #555;
      margin-top: 12px;
      text-align: center;
    }
    #result-box {
      width: 100%;
      height: 140px;
      margin-top: 10px;
      padding: 8px;
      font-size: 11px;
      font-family: monospace;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      resize: none;
      display: none;
    }
  </style>
</head>
<body>
  <h2>HokieTutor Canvas Sync</h2>
  <button id="fetch-btn">Fetch Canvas Assignments</button>
  <div id="status">Ready to sync with Canvas.</div>
  <textarea id="result-box" readonly></textarea>

  <script src="popup.js"></script>
</body>
</html>
